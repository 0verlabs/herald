name: Ready

on:
  push:
  pull_request:

jobs:
  ready:
    runs-on: ubuntu-latest
    env:
      ERC_8004_SUBGRAPH_URL: ${{ vars.ERC_8004_SUBGRAPH_URL }}
      ERC_8004_SUBGRAPH_API_KEY: ${{ secrets.ERC_8004_SUBGRAPH_API_KEY }}
      ERC_8183_SUBGRAPH_URL: ${{ vars.ERC_8183_SUBGRAPH_URL }}
      ERC_8183_SUBGRAPH_API_KEY: ${{ secrets.ERC_8183_SUBGRAPH_API_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          cache: true
      - run: vp install
      - run: vp run ready
